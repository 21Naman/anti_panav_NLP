# DeBERTa focus-marked multiple choice (4 choices = 4 speakers, softmax across them).
#   liars train --config configs/deberta_mc.yaml --test data/bench/test.jsonl     (5-fold)
#   liars train --config configs/deberta_mc.yaml --stage 1        (pretrain on stage1.jsonl, saves model)
#   liars train --config configs/deberta_mc.yaml --stage 2 --test data/bench/test.jsonl   (5-fold from stage 1)
#   add --debug to any of these for a CPU run with the xsmall checkpoint
# Speed option: --set deberta.model_id=MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
seed: 42

data:
  train: data/bench/train.jsonl
  test: data/bench/test.jsonl
  folds: null

cv:
  k: 5
  seed: 42
  holdout_fold: 0

train:
  mode: kfold
  refit_full: false
  inner_val_frac: 0.05
  init_from_run: null

model:
  name: deberta_mc

deberta:
  model_id: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli   # NLI init (Phase 3)
  device: auto
  fp16: true
  gradient_checkpointing: true   # needed for large on a T4 (full fine-tune OOMs at micro batch 2); ~30% slower
  max_len: 512
  budget_margin: 8          # token safety margin so the marked speaker's lines are never cut
  special_tokens_budget: 3  # [CLS] a [SEP] b [SEP]
  mark_cost: 4              # tokens added per marked line ("<t> ", " </t>")
  mark_open: "<t>"
  mark_close: "</t>"
  evidence_prefix: "Evidence: "
  line_format: "{speaker}: {text}"
  question: "Is the marked speaker contradicting the evidence?"
  lr: 1.5e-5
  layerwise_lr_decay: 1.0   # < 1.0 = lower LR for lower layers (e.g. 0.9)
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  micro_batch_size: 2       # chats per micro batch (x 4 choices)
  grad_accum: 8
  eval_batch_size: 8
  epochs: 3
  eval_every_frac: 0.5
  patience: 3
  time_probe_steps: 20
  max_gpu_hours: 4.0         # abort after the time probe if the remaining fits would take longer
  temperatures: [0.25, 0.5, 1.0, 2.0, 4.0]
  save_model: false         # kfold predictions are made in-run; stage 1 saves (see stages)

augment:
  tta_n: 2
  permute_train: true
  shuffle_evidence: false

stages:
  1:
    data: {train: data/bench/stage1.jsonl, test: null}
    cv: {k: 20}             # holdout fold 0 = 5% (run `liars folds --in data/bench/stage1.jsonl --k 20`)
    train: {mode: holdout}
    deberta: {epochs: 1, save_model: true}
  2:
    train: {mode: kfold, init_from_run: "latest:deberta_mc_s1"}

paths:
  data_dir: data

debug:
  data:
    train: tests/fixtures/tiny.jsonl
    test: tests/fixtures/tiny.jsonl
  cv: {k: 5}
  deberta:
    model_id: cross-encoder/nli-deberta-v3-xsmall
    device: cpu
    max_len: 256
    micro_batch_size: 4
    grad_accum: 1
    epochs: 1
    eval_every_frac: 0.5
    time_probe_steps: 2
  augment:
    tta_n: 2
