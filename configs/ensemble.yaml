# `liars ensemble` and `liars analyze` settings.
seed: 42

ensemble:
  seed: 42
  inner_k: 5             # inner K-fold over the aligned OOF rows for honest weighted/stack scores
  stack_l2: 0.01
  stack_margin: 0.003    # auto picks stack only if it beats mean/weighted by > 0.3 points

analysis:
  length_bins: [0, 10, 14, 18, 22, 1000]       # messages per chat
  confidence_bins: [0.0, 0.4, 0.6, 0.8, 0.9, 0.95, 1.0]

paths:
  data_dir: data
