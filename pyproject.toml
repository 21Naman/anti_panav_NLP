[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liars"
version = "0.1.0"
description = "Liar's Chatroom: find the speaker who contradicts the evidence."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "pyyaml",
    "typer",
    "scikit-learn",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]
nlp = [
    "torch",
    "transformers",
    "datasets",
    "peft",
    "bitsandbytes",
    "accelerate",
    "sentencepiece",
]

[project.scripts]
liars = "liars.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
